name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:eggs
      - run: npm run build
      - run: npm run budget
      - name: Use runner Chromium or install Playwright browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "RELAY_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm test -- --reporter=line,github
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-ci
          MYSQL_USER: relay
          MYSQL_PASSWORD: disposable-ci
          MYSQL_DATABASE: relay_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      RELAY_ENV: staging
      RELAY_RUN_MYSQL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:identity
        env:
          RELAY_STAGING_DATABASE_URL: mysql://relay:disposable-ci@127.0.0.1:${{ job.services.mysql.ports[3306] }}/relay_test
      - run: npm run build
      - name: Use runner Chromium or install Playwright browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "RELAY_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: bash scripts/auth-browser-contract.sh
        env:
          RELAY_STAGING_DATABASE_URL: mysql://relay:disposable-ci@127.0.0.1:${{ job.services.mysql.ports[3306] }}/relay_test
  wings-bootstrap:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        scenario: [lifecycle, adoption, legacy-panel, gitea-qualification]
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-ci
          MYSQL_USER: relay
          MYSQL_PASSWORD: disposable-ci
          MYSQL_DATABASE: relay_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      RELAY_ENV: staging
      RELAY_DISPOSABLE_WINGS_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:wings
      - if: matrix.scenario == 'legacy-panel'
        run: npm run build
      - if: matrix.scenario == 'legacy-panel'
        name: Use runner Chromium or install Playwright browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "RELAY_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: bash scripts/wings-contract.sh
        env:
          RELAY_RECOVERY_MYSQL_SERVICE: ${{ job.services.mysql.id }}
          RELAY_BOOTSTRAP_SCENARIO: ${{ matrix.scenario }}
          RELAY_EXPERIMENTAL_GITEA: ${{ matrix.scenario == 'gitea-qualification' && '1' || '' }}
          RELAY_STAGING_DATABASE_URL: mysql://relay:disposable-ci@127.0.0.1:${{ job.services.mysql.ports[3306] }}/relay_test
  wings-transfer:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [reported, missing-report, sender-killed, partial-target, mumble-reported, mumble-missing-report, same-pair, corrupt-archive]
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-ci
          MYSQL_USER: relay
          MYSQL_PASSWORD: disposable-ci
          MYSQL_DATABASE: relay_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      RELAY_ENV: staging
      RELAY_DISPOSABLE_WINGS_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - run: bash scripts/wings-transfer-contract.sh
        env:
          RELAY_TRANSFER_SCENARIO: ${{ matrix.scenario }}
          RELAY_STAGING_DATABASE_URL: mysql://relay:disposable-ci@127.0.0.1:${{ job.services.mysql.ports[3306] }}/relay_test
