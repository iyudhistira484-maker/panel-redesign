name: Relay Wings off-host staging
on:
  workflow_dispatch:
    inputs:
      require_independent_keys:
        description: Require runtime seed from Actions Secrets (pilot rehearsal)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-ci
          MYSQL_USER: relay
          MYSQL_PASSWORD: disposable-ci
          MYSQL_DATABASE: relay_test
        ports: [3306/tcp]
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      RELAY_ENV: staging
      RELAY_DISPOSABLE_WINGS_CI: '1'
      CERT: ${{ vars.RELAY_RECOVERY_RECIPIENT_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - run: npm ci && npm run build
      - name: Create real Relay and Wings checkpoint
        id: checkpoint
        env:
          RELAY_STAGING_DATABASE_URL: mysql://relay:disposable-ci@127.0.0.1:${{ job.services.mysql.ports[3306] }}/relay_test
          RELAY_OFFHOST_RUNTIME_SEED: ${{ secrets.RELAY_RECOVERY_RUNTIME_SEED }}
          REQUIRE_INDEPENDENT_KEYS: ${{ inputs.require_independent_keys }}
          RELAY_RECOVERY_MYSQL_SERVICE: ${{ job.services.mysql.id }}
          RELAY_BOOTSTRAP_SCENARIO: legacy-panel
        run: |
          set -euo pipefail
          umask 077
          if [[ "$REQUIRE_INDEPENDENT_KEYS" == true && -z "$RELAY_OFFHOST_RUNTIME_SEED" ]]; then
            echo 'Configure RELAY_RECOVERY_RUNTIME_SEED before running in pilot mode'
            exit 1
          fi
          test -n "$CERT"
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          export RELAY_OFFHOST_EXPORT="$work"
          if command -v google-chrome >/dev/null; then export RELAY_CHROMIUM_PATH=$(command -v google-chrome); else npx playwright install --with-deps chromium; fi
          bash scripts/wings-contract.sh
          printf '%s\n' "$CERT" > "$work/recipient.crt"
          openssl req -x509 -newkey rsa:3072 -nodes -days 1 -subj /CN=relay-checkpoint -keyout "$work/signer.key" -out "$work/signer.crt" 2>/dev/null
          mkdir -m 0700 "$RUNNER_TEMP/artifact"
          python3 scripts/relay-offhost-bundle.py pack --checkpoint "$GITHUB_RUN_ID" --signer "$work/signer.crt" --signing-key "$work/signer.key" --recipient "$work/recipient.crt" --database "$work/database.sql" --volume "$work/volume.tar" --output "$RUNNER_TEMP/artifact/checkpoint.cms"
          openssl cms -sign -binary -nodetach -md sha256 -in "$work/runtime.json" -signer "$work/signer.crt" -inkey "$work/signer.key" -outform DER -out "$work/runtime.signed"
          openssl cms -encrypt -binary -aes-256-gcm -in "$work/runtime.signed" -outform DER -out "$RUNNER_TEMP/artifact/runtime.cms" "$work/recipient.crt"
          cp "$work/signer.crt" "$RUNNER_TEMP/artifact/"
          echo "signer_digest=$(sha256sum "$work/signer.crt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-checkpoint
          path: ${{ runner.temp }}/artifact/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
    outputs:
      signer_digest: ${{ steps.checkpoint.outputs.signer_digest }}
  restore:
    needs: checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-ci
          MYSQL_USER: relay
          MYSQL_PASSWORD: disposable-ci
          MYSQL_DATABASE: relay_test
        ports: [3306/tcp]
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      RELAY_ENV: staging
      RELAY_DISPOSABLE_WINGS_CI: '1'
      RELAY_BOOTSTRAP_SCENARIO: offhost-restore
      CERT: ${{ vars.RELAY_RECOVERY_RECIPIENT_CERT }}
      SIGNER_DIGEST: ${{ needs.checkpoint.outputs.signer_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start restore exercise clock
        run: echo "RELAY_OFFHOST_STARTED=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-checkpoint
          path: ${{ runner.temp }}/checkpoint-artifact
      - name: Recover into fresh MySQL and a fresh workload volume
        env:
          RELAY_STAGING_DATABASE_URL: mysql://relay:disposable-ci@127.0.0.1:${{ job.services.mysql.ports[3306] }}/relay_test
          MYSQL: ${{ job.services.mysql.id }}
          RELAY_OFFHOST_RUNTIME_SEED: ${{ secrets.RELAY_RECOVERY_RUNTIME_SEED }}
          PRIVATE_KEY: ${{ secrets.RELAY_RECOVERY_RECIPIENT_KEY }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRIVATE_KEY" || { echo 'Configure RELAY_RECOVERY_RECIPIENT_KEY before dispatching'; exit 1; }
          printf '%s\n' "$CERT" > recipient.crt
          printf '%s\n' "$PRIVATE_KEY" > recipient.key
          trap 'rm -f -- "$RUNNER_TEMP/recipient.key"; rm -rf -- "$RUNNER_TEMP/checkpoint-artifact"' EXIT
          unset PRIVATE_KEY
          cd checkpoint-artifact
          printf '%s  signer.crt\n' "$SIGNER_DIGEST" | sha256sum -c -
          restore=(python3 "$GITHUB_WORKSPACE/scripts/relay-offhost-bundle.py" unpack --checkpoint "$GITHUB_RUN_ID" --signer signer.crt --recipient ../recipient.crt --recipient-key ../recipient.key)
          python3 - <<'PY'
          from pathlib import Path
          data = bytearray(Path('checkpoint.cms').read_bytes())
          data[len(data) // 2] ^= 1
          Path('corrupt.cms').write_bytes(data)
          PY
          if "${restore[@]}" --bundle corrupt.cms --output rejected; then exit 1; fi
          test ! -e rejected
          "${restore[@]}" --bundle checkpoint.cms --output recovered
          openssl cms -decrypt -binary -inform DER -in runtime.cms -recip ../recipient.crt -inkey ../recipient.key -out runtime.signed
          openssl cms -verify -binary -inform DER -in runtime.signed -nointern -noverify -certfile signer.crt -out runtime.json
          export RELAY_OFFHOST_RUNTIME="$PWD/runtime.json"
          export RELAY_OFFHOST_VOLUME="$PWD/recovered/volume.tar"
          docker exec -i "$MYSQL" sh -ec 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -uroot relay_test' < recovered/database.sql
          cd "$GITHUB_WORKSPACE"
          bash scripts/wings-contract.sh
